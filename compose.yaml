services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: sqlfaker
      POSTGRES_USER: sqlfaker
      POSTGRES_PASSWORD: local_demo_password
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlfaker -d sqlfaker"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
